name: CI

on:
  push:
    branches: [test]
  pull_request:
    branches: [test, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build is reproducible (committed output matches source)
        run: |
          D=$(grep -o '"dateModified":"[^"]*"' index.html | head -1 | cut -d'"' -f4)
          SOURCE_DATE="$D" npm run build
          git diff --exit-code --ignore-matching-lines='id="structured-data"' -- index.html es/index.html it/index.html assets/css/tailwind.css
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Dependency audit (production-relevant, non-blocking)
        run: npm audit --audit-level=high || true
