# Production health check, every 30 minutes (and on demand). Free: no external service, no card.
# A failure e-mails the people who watch Actions failures (GitHub default: the author of the last change to this file).
# What it proves is listed in scripts/uptime-check.mjs. Scheduled runs always use the default branch (master).
name: Uptime

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the live site, redirects, certificate, e-mail routing and security.txt
        run: node scripts/uptime-check.mjs
