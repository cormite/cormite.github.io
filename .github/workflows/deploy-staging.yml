# Deploys the `test` branch to the PRIVATE staging site on Cloudflare Pages
# (protected by Cloudflare Access: only approved emails can open it).
# Production (www.cormite.com) is never touched by this workflow.
name: Deploy staging

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  CF_PROJECT: cormite-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble staging site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'tests' \
            --exclude 'scripts' --exclude 'docs' --exclude '_site' --exclude 'CNAME' \
            --exclude 'package*.json' --exclude '*.config.*' --exclude 'test-results' ./ _site/
          # Keep staging out of search engines, and add the security headers GitHub Pages cannot send.
          sed -i "s#<head>#<head><meta name=\"robots\" content=\"noindex,nofollow\">#" _site/index.html _site/es/index.html _site/it/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          rm -f _site/sitemap.xml
          cat > _site/_headers <<'HDR'
          /*
            X-Robots-Tag: noindex, nofollow
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=(), interest-cohort=()
            Strict-Transport-Security: max-age=31536000; includeSubDomains
          HDR
          echo "Staging build of ${GITHUB_SHA} at $(date -u +%FT%TZ)" > _site/BUILD.txt
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name "$CF_PROJECT" --branch main --commit-dirty=true
      - name: Summary
        run: |
          echo "Staging URL (private, login required): https://${CF_PROJECT}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
