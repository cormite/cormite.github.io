# PRODUCTION deploy. Manual only. Two gates:
#   1. You must type DEPLOY in the dispatch form.
#   2. The `production` GitHub Environment requires an approval from a reviewer.
#
# Where it publishes is controlled by the repository variable PRODUCTION_TARGET:
#   github-pages (default) -> GitHub Pages (needs Settings > Pages > Source = "GitHub Actions")
#   cloudflare             -> Cloudflare Pages project (real security headers, immutable caching)
# Rollback = set the variable back and re-run this workflow. See docs/RELEASE.md.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish master to production'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PRODUCTION_TARGET: ${{ vars.PRODUCTION_TARGET || 'github-pages' }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      # Values reach the shell through environment variables, never by expanding ${{ }} inside the script, so a crafted
      # input cannot become shell code (script injection).
      - name: Require explicit confirmation, master ref and a known target
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          [ "$CONFIRM" = "DEPLOY" ] || { echo "Confirmation text must be DEPLOY"; exit 1; }
          [ "$REF" = "refs/heads/master" ] || { echo "Production deploys only from master"; exit 1; }
          case "$PRODUCTION_TARGET" in github-pages|cloudflare) echo "Target: $PRODUCTION_TARGET";; *) echo "PRODUCTION_TARGET must be github-pages or cloudflare"; exit 1;; esac

  # Same verification as CI, run again on master before anything is published: static checks and the test groups run
  # side by side; `verify` passes only when all of them passed.
  static:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - name: Build is reproducible (committed output matches source)
        run: |
          D=$(grep -o '"dateModified":"[^"]*"' index.html | head -1 | cut -d'"' -f4)
          SOURCE_DATE="$D" npm run build
          git add -A
          git diff --cached --exit-code --ignore-matching-lines='id="structured-data"' -- . ':!package-lock.json' \
            || { echo "::error::Committed build output is stale. Run 'npm run build' and commit the result."; exit 1; }
      - name: Dependency audit (fails on high severity)
        run: npm audit --audit-level=high

  tests:
    name: tests (${{ matrix.name }})
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: contrast-desktop, group: contrast, args: '--project=desktop' }
          - { name: contrast-mobile, group: contrast, args: '--project=mobile' }
          - { name: quality, group: quality, args: '' }
          - { name: ui, group: ui, args: '' }
          - { name: media, group: media, args: '' }
          - { name: rest, group: rest, args: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          browser: 'true'
      - name: Playwright tests (${{ matrix.name }})
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: npx playwright test ${{ matrix.args }}

  verify:
    needs: [static, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every static check and every test group must have succeeded
        run: |
          echo "static: ${{ needs.static.result }}"
          echo "tests:  ${{ needs.tests.result }}"
          [ "${{ needs.static.result }}" = "success" ] && [ "${{ needs.tests.result }}" = "success" ] \
            || { echo "::error::verification failed, nothing is deployed"; exit 1; }

  deploy-github-pages:
    if: ${{ (vars.PRODUCTION_TARGET || 'github-pages') == 'github-pages' }}
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site (allowlist + reference check)
        run: node scripts/assemble-site.mjs --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    if: ${{ vars.PRODUCTION_TARGET == 'cloudflare' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://cormite-production.pages.dev' }}
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cormite-production.pages.dev' }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'cormite-production' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Assemble site (allowlist, reference check, production headers)
        run: node scripts/assemble-site.mjs --cloudflare --out _site
      # Run from INSIDE _site: wrangler bundles ./functions from its working directory, and the repository's
      # functions/_middleware.js is the STAGING password gate (it answers 503 when STAGING_PASSWORD is unset).
      - name: Deploy to Cloudflare Pages
        working-directory: _site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.157.0 pages deploy .
          --project-name "$CF_PROJECT" --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "Deploy production ${GITHUB_SHA::7}"
      - name: Verify the live site (security headers, caching, nothing internal published)
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-live.mjs "$PRODUCTION_URL"; then exit 0; fi
            echo "Attempt $attempt failed; waiting for the edge to update..."; sleep 15
          done
          exit 1
